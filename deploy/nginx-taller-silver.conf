# /etc/nginx/sites-available/taller-silver
# nginx interno del contenedor: unifica dashboard (3000) y API/WebSocket (3001)
# en el puerto 80, que es lo único que sale del LXC. Es el que hace el upgrade
# a WebSocket para Socket.io — el proxy de rewrites de Next NO lo hace.
#
# Requiere /etc/nginx/conf.d/upgrade-map.conf:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream taller_web { server 127.0.0.1:3100; keepalive 16; }
upstream taller_api { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80 default_server;
    listen 3000;                 # compatibilidad con proxys ya apuntados al 3000
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /socket.io/ {
        proxy_pass http://taller_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://taller_api;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://taller_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://taller_web;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
